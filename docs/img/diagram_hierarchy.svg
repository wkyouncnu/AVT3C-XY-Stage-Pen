<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#fff"/>

  <!-- layer bands -->
  <g font-size="12" fill="#555">
    <rect x="10" y="10" width="980" height="120" fill="#f6f6f6" stroke="#ccc"/>
    <text x="22" y="30" font-weight="bold">0 단 · 측정 (항법)</text>
    <rect x="10" y="140" width="980" height="150" fill="#fff" stroke="#ccc"/>
    <text x="22" y="160" font-weight="bold">1 단 · 미션 (유도)</text>
    <rect x="10" y="300" width="980" height="200" fill="#f6f6f6" stroke="#ccc"/>
    <text x="22" y="320" font-weight="bold">2 단 · 제어 (macro: 로봇 / micro: 스테이지)</text>
    <rect x="10" y="510" width="980" height="240" fill="#fff" stroke="#ccc"/>
    <text x="22" y="530" font-weight="bold">3 단 · 구동기 내부 루프 (실기: 장비 펌웨어 / 가상 실험: 운동모델)</text>
  </g>

  <!-- layer 0 -->
  <g font-family="Consolas, monospace" font-size="11.5">
    <rect x="40" y="45" width="190" height="66" fill="#fff" stroke="#888"/>
    <text x="50" y="63">/zerokey/position</text>
    <text x="50" y="79">/zerokey/vel</text>
    <text x="50" y="95">/imu/data</text>
    <text x="50" y="107" font-size="10.5" fill="#666">20 Hz · 20 Hz · 100 Hz</text>
  </g>
  <rect x="300" y="50" width="200" height="56" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="400" y="73" text-anchor="middle" font-weight="bold" fill="#1f3a5f">RosIn → Nav</text>
  <text x="400" y="93" text-anchor="middle" font-size="11.5">p = (z, x),  ψ = 요각 − 요각₀ + ψ₀</text>
  <line x1="230" y1="78" x2="298" y2="78" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="580" y="50" width="380" height="56" fill="#fff" stroke="#888"/>
  <text x="595" y="72" font-size="12">pose = [p₁; p₂; ψ]   (태그 위치 m, heading rad)</text>
  <text x="595" y="92" font-size="11.5" fill="#555">선택: tau_pred &gt; 0 이면 p ← p + τ·v (지연 보상)</text>
  <line x1="500" y1="78" x2="578" y2="78" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- layer 1 -->
  <rect x="60" y="180" width="200" height="90" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="160" y="202" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Guards</text>
  <g font-size="11.5"><text x="75" y="224">dist_start  출발점까지 거리</text><text x="75" y="242">th_err  직선 방향 오차</text><text x="75" y="260">along_rem  남은 진행 거리</text></g>
  <rect x="340" y="180" width="220" height="90" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="450" y="202" text-anchor="middle" font-weight="bold" fill="#1f3a5f">ModeChart (Stateflow)</text>
  <g font-size="11.5"><text x="355" y="224">mode 1 출발점 이동  2 회전</text><text x="355" y="242">mode 3 직선 추종 (펜)</text><text x="355" y="260">mode 4 정지  5 종료</text></g>
  <rect x="640" y="180" width="320" height="90" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="800" y="202" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Waypoints</text>
  <g font-size="11.5"><text x="655" y="224">WP_prev, WP_target  로봇(태그)이 따라갈 선분</text><text x="655" y="242">lineAB = [A; B]  펜이 그릴 직선</text><text x="655" y="260">t_line  모드 3 진입 시각</text></g>
  <line x1="260" y1="225" x2="338" y2="225" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="560" y1="225" x2="638" y2="225" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <!-- pose down to guards -->
  <path d="M770,106 L770,130 L160,130 L160,178" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="480" y="125" text-anchor="middle" font-size="11" fill="#555">pose</text>

  <!-- layer 2 robot -->
  <rect x="60" y="340" width="420" height="140" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="270" y="360" text-anchor="middle" font-weight="bold" fill="#1f3a5f">RobotCtrl (macro) — 모드별 Enabled Subsystem 4 개 + Merge</text>
  <g font-size="11.5">
    <rect x="75" y="372" width="95" height="44" fill="#fff" stroke="#1f3a5f"/><text x="122" y="390" text-anchor="middle">M1 Goto</text><text x="122" y="407" text-anchor="middle" font-size="10.5">K_dist, K_yaw</text>
    <rect x="175" y="372" width="95" height="44" fill="#fff" stroke="#1f3a5f"/><text x="222" y="390" text-anchor="middle">M2 Turn</text><text x="222" y="407" text-anchor="middle" font-size="10.5">v = 0, K_yaw</text>
    <rect x="275" y="372" width="95" height="44" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/><text x="322" y="390" text-anchor="middle">M3 Line</text><text x="322" y="407" text-anchor="middle" font-size="10.5">K_px, K_py, K_pθ</text>
    <rect x="375" y="372" width="95" height="44" fill="#fff" stroke="#1f3a5f"/><text x="422" y="390" text-anchor="middle">M4 Stop</text><text x="422" y="407" text-anchor="middle" font-size="10.5">끝점 유지</text>
    <text x="75" y="440">출력  v_cmd [m/s], w_cmd [rad/s]  (포화 v_max, w_max)</text>
    <text x="75" y="460" fill="#555">선택: M3 에 /stage/pos 편차 → 중앙 유지 (K_c, K_ci)</text>
  </g>
  <rect x="510" y="380" width="140" height="56" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="580" y="402" text-anchor="middle" font-weight="bold" fill="#1f3a5f">PwmMap</text>
  <text x="580" y="422" text-anchor="middle" font-size="11">calc_pwm (데드존)</text>
  <line x1="480" y1="408" x2="508" y2="408" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <!-- layer 2 pen -->
  <rect x="690" y="340" width="270" height="140" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="825" y="360" text-anchor="middle" font-weight="bold" fill="#1f3a5f">PenCtrl (micro)</text>
  <g font-size="11.5">
    <text x="705" y="384">PenComp  s = s_c + 1000(Rᵀ(p* − p) − d)</text>
    <text x="705" y="404">Travel  0–101.6 mm 포화</text>
    <text x="705" y="424">CmdRate  변화율 ≤ 83 mm/s</text>
    <text x="705" y="444">출력  stage_target_pos [mm], pen_on</text>
    <text x="705" y="464" fill="#555">입력  lineAB, mode, pose</text>
  </g>
  <!-- WP down -->
  <path d="M700,270 L700,300 L270,300 L270,338" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M900,270 L900,338" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="470" y="296" font-size="11" fill="#555">WP_prev, WP_target, mode, t_line</text>
  <text x="908" y="300" font-size="11" fill="#555">lineAB, mode</text>

  <!-- layer 3 -->
  <g font-family="Consolas, monospace" font-size="11.5">
    <rect x="510" y="545" width="140" height="26" fill="#fff" stroke="#888"/><text x="580" y="562" text-anchor="middle">/motor_pwm</text>
    <rect x="760" y="545" width="150" height="26" fill="#fff" stroke="#888"/><text x="835" y="562" text-anchor="middle">/stage/target_pos</text>
  </g>
  <line x1="580" y1="436" x2="580" y2="543" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="835" y1="480" x2="835" y2="543" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="380" y="595" width="330" height="135" fill="#fff" stroke="#888"/>
  <text x="545" y="616" text-anchor="middle" font-weight="bold" fill="#333">로봇 구동 (RobotPlant)</text>
  <g font-size="11.5" fill="#333">
    <text x="395" y="638">ESC 역변환 → 궤도 지연 τ_trk → 속도 PID (v, ω)</text>
    <text x="395" y="658">→ 구동력 배분 (F_L, F_R ≤ F_max)</text>
    <text x="395" y="678">→ 동역학 (N_mag, 중력, 회전 저항) → V_true</text>
    <text x="395" y="698">→ 기구학 + 벽면 외란 → q_true = [p₁; p₂; ψ]</text>
    <text x="395" y="718" fill="#666">대역 약 0.5 Hz (횡방향은 회전으로만 고침)</text>
  </g>
  <rect x="730" y="595" width="250" height="135" fill="#fff" stroke="#888"/>
  <text x="855" y="616" text-anchor="middle" font-weight="bold" fill="#333">Zaber 스테이지 (StagePlant)</text>
  <g font-size="11.5" fill="#333">
    <text x="745" y="638">명령 ZOH 25 Hz + 지연 10 ms</text>
    <text x="745" y="658">→ 사다리꼴 궤적 (104 mm/s)</text>
    <text x="745" y="678">→ 위치 루프 + 추력-속도 한계</text>
    <text x="745" y="698">→ x_s [m, m/s] → /stage/pos</text>
    <text x="745" y="718" fill="#666">대역 약 20 Hz</text>
  </g>
  <line x1="580" y1="571" x2="580" y2="593" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="835" y1="571" x2="835" y2="593" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="40" y="595" width="310" height="135" fill="#fff" stroke="#888"/>
  <text x="195" y="616" text-anchor="middle" font-weight="bold" fill="#333">Sensors → 0 단으로 되돌아감</text>
  <g font-size="11.5" fill="#333">
    <text x="55" y="638">ZeroKey 위치: 잡음 1 mm, 지연 50 ms, 20 Hz</text>
    <text x="55" y="658">ZeroKey 속도: 20 Hz</text>
    <text x="55" y="678">IMU 요각: 잡음 0.3°, 드리프트 0.02°/s</text>
    <text x="55" y="698">스테이지 엔코더: 20 Hz</text>
    <text x="55" y="718" fill="#666">q_true, x_s 는 제어기가 직접 보지 못함</text>
  </g>
  <line x1="378" y1="662" x2="352" y2="662" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
</svg>
