<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="230" fill="#fff"/>
  <g>
    <rect x="20"  y="60" width="160" height="70" fill="#fff" stroke="#1f3a5f" stroke-width="1.3"/>
    <rect x="225" y="60" width="160" height="70" fill="#fff" stroke="#1f3a5f" stroke-width="1.3"/>
    <rect x="430" y="60" width="180" height="70" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.8"/>
    <rect x="655" y="60" width="160" height="70" fill="#fff" stroke="#1f3a5f" stroke-width="1.3"/>
    <rect x="860" y="60" width="120" height="70" fill="#fff" stroke="#888"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="88" font-weight="bold" fill="#1f3a5f">1 Goto_Start</text><text x="100" y="110" font-size="11.5">출발점으로 주행</text>
    <text x="305" y="88" font-weight="bold" fill="#1f3a5f">2 Turning</text><text x="305" y="110" font-size="11.5">제자리 회전</text>
    <text x="520" y="88" font-weight="bold" fill="#1f3a5f">3 Line_Tracking</text><text x="520" y="110" font-size="11.5">직선 추종 + 펜 보상</text>
    <text x="735" y="88" font-weight="bold" fill="#1f3a5f">4 Stop_Destination</text><text x="735" y="110" font-size="11.5">끝점 유지</text>
    <text x="920" y="88" font-weight="bold" fill="#555">5 Done</text><text x="920" y="110" font-size="11.5" fill="#555">시뮬레이션 정지</text>
  </g>
  <g stroke="#333" stroke-width="1.2" marker-end="url(#a)">
    <line x1="180" y1="95" x2="223" y2="95"/>
    <line x1="385" y1="95" x2="428" y2="95"/>
    <line x1="610" y1="95" x2="653" y2="95"/>
    <line x1="815" y1="95" x2="858" y2="95"/>
  </g>
  <g font-family="Consolas, monospace" font-size="11" fill="#333" text-anchor="middle">
    <text x="202" y="160">dist_start</text><text x="202" y="175">&lt; d_reach</text>
    <text x="407" y="160">after(1 s) &amp;</text><text x="407" y="175">|th_err| &lt; th_tol</text>
    <text x="632" y="160">along_rem</text><text x="632" y="175">&lt; d_reach</text>
    <text x="837" y="160">after(2 s)</text>
  </g>
  <text x="520" y="40" text-anchor="middle" font-size="11.5" fill="#1f3a5f">펜 다운 구간 (0 ≤ σ ≤ L) 은 모드 3 안에서만</text>
  <g font-size="11" fill="#666">
    <text x="20" y="210">d_reach = 0.03 m,  th_tol = 1°  (실기 Chart 와 같은 값)</text>
  </g>
</svg>
