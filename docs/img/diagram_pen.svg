<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>

  <!-- wall axes -->
  <line x1="40" y1="390" x2="40" y2="300" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
    <line x1="40" y1="390" x2="130" y2="390" stroke="#333" stroke-width="1.2"/>
  <text x="48" y="305" font-size="12">p₁ (높이, 위 +)</text>
  <text x="70" y="410" font-size="12">벽 정면에서 오른쪽 = −p₂</text>

  <!-- target line -->
  <line x1="120" y1="250" x2="620" y2="250" stroke="#9aa8b8" stroke-width="7"/>
  <circle cx="120" cy="250" r="5" fill="#1f3a5f"/><text x="110" y="278" font-weight="bold">A</text>
  <circle cx="620" cy="250" r="5" fill="#1f3a5f"/><text x="612" y="278" font-weight="bold">B</text>
  <text x="560" y="238" font-size="12" fill="#1f3a5f">u = (B − A)/L</text>

  <!-- robot body rotated by small angle -->
  <g transform="rotate(-6 360 210)">
    <rect x="270" y="150" width="200" height="130" fill="#f2f2f2" fill-opacity="0.8" stroke="#666" stroke-width="1.2"/>
    <rect x="270" y="138" width="200" height="12" fill="#ccc" stroke="#888"/>
    <rect x="270" y="280" width="200" height="12" fill="#ccc" stroke="#888"/>
    <!-- body axes from center -->
    <line x1="370" y1="215" x2="450" y2="215" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
    <line x1="370" y1="215" x2="370" y2="165" stroke="#333" stroke-width="1" marker-end="url(#a)"/>
    <text x="440" y="208" font-size="11">x_B</text>
    <text x="376" y="172" font-size="11">y_B</text>
    <!-- stage rectangle around center -->
    <rect x="335" y="180" width="70" height="70" fill="none" stroke="#1f3a5f" stroke-dasharray="4 3"/>
    <!-- tag -->
    <rect x="296" y="193" width="12" height="12" fill="#333"/>
  </g>
  <line x1="300" y1="205" x2="215" y2="160" stroke="#666" stroke-width="0.8"/><text x="150" y="155" font-size="12">태그 T (위치 p)</text>
  <line x1="400" y1="180" x2="470" y2="105" stroke="#1f3a5f" stroke-width="0.8"/><text x="430" y="98" font-size="11.5" fill="#1f3a5f">스테이지 행정 ±50.8 mm (점선)</text>

  <!-- center C and pen P -->
  <circle cx="372" cy="226" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="368" y1="223" x2="240" y2="105" stroke="#666" stroke-width="0.8"/><text x="150" y="98" font-size="12">C = p + R d (스테이지 중앙일 때 펜)</text>
  <circle cx="378" cy="250" r="5" fill="#c0392b"/>
  <line x1="380" y1="254" x2="420" y2="330" stroke="#c0392b" stroke-width="0.8"/><text x="400" y="346" font-size="12" fill="#c0392b">펜 P = p* (직선 위 수선의 발)</text>
  <line x1="373" y1="230" x2="377" y2="245" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#n)"/>
  <line x1="376" y1="238" x2="300" y2="330" stroke="#1f3a5f" stroke-width="0.8"/><text x="160" y="346" font-size="11.5" fill="#1f3a5f">스테이지 이동 R(s − s_c)/1000</text>

  <!-- equations -->
  <g font-size="12.5">
    <rect x="660" y="60" width="320" height="300" fill="#fff" stroke="#888"/>
    <text x="675" y="86" font-weight="bold" fill="#1f3a5f">PenComp (모드 3)</text>
    <text x="675" y="114" font-family="Consolas, monospace" font-size="12">d  = r_pen0 − r_tag</text>
    <text x="675" y="138" font-family="Consolas, monospace" font-size="12">C  = p + R(ψ) d</text>
    <text x="675" y="162" font-family="Consolas, monospace" font-size="12">σ  = uᵀ (C − A)</text>
    <text x="675" y="186" font-family="Consolas, monospace" font-size="12">p* = A + σ u</text>
    <text x="675" y="210" font-family="Consolas, monospace" font-size="12">e_B = Rᵀ(ψ)(p* − p) − d</text>
    <text x="675" y="234" font-family="Consolas, monospace" font-size="12">s  = s_c + 1000 e_B  [mm]</text>
    <text x="675" y="258" font-family="Consolas, monospace" font-size="12">pen_on = (0 ≤ σ ≤ L)</text>
    <text x="675" y="290" font-size="11.5" fill="#333">R(ψ) = [cos ψ  −sin ψ; sin ψ  cos ψ]</text>
    <text x="675" y="310" font-size="11.5" fill="#333">진행 방향은 로봇, 직선과의 어긋남만 스테이지</text>
    <text x="675" y="330" font-size="11.5" fill="#333">p* 는 A, B 로 자르지 않음 (행정 끝 방지)</text>
  </g>
</svg>
